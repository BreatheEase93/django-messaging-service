{% extends 'base.html' %}

{% block title %}Сохранение данных{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold mb-4 text-dark text-center">📝 Шаблон письма</h3>
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    
                    <!-- Рендерим поля формы в стиле Bootstrap -->
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">💾 Сохранить запись</button>
                        <a href="javascript:history.back()" class="btn btn-light">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
