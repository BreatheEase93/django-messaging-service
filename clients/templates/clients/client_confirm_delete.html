{% extends 'base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm text-center p-4">
            <div class="card-body">
                <div class="text-danger display-1 mb-3">⚠️</div>
                <h3 class="fw-bold text-dark mb-3">Вы уверены?</h3>
                <p class="text-muted mb-4">Это действие необратимо. Запись будет полностью удалена из базы данных PostgreSQL без возможности восстановления.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg fw-semibold">🔥 Да, удалить навсегда</button>
                        <a href="javascript:history.back()" class="btn btn-light">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
