{% extends 'base.html' %}

{% block title %}Авторизация{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <h3 class="fw-bold text-center mb-4 text-dark">🔑 Вход в систему</h3>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Войти</button>
                    </div>
                </form>
                <div class="text-center mt-4 border-top pt-3">
                    <p class="mb-1 small"><a href="{% url 'users:password_reset' %}" class="text-decoration-none">Забыли пароль? Восстановить</a></p>
                    <p class="mb-0 small text-muted">Ещё нет аккаунта? <a href="{% url 'users:register' %}" class="text-decoration-none fw-semibold">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
