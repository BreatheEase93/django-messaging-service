{% extends 'base.html' %}

{% block title %}Инструкции отправлены{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <div class="text-primary display-3 mb-3">📬</div>
                <h3 class="fw-bold text-dark mb-3">Проверьте вашу почту</h3>
                <p class="text-muted mb-4">Мы отправили вам на email ссылку для восстановления доступа. Если письмо не пришло в течение пары минут, проверьте папку «Спам».</p>
                <div class="d-grid">
                    <a href="{% url 'users:login' %}" class="btn btn-primary">Понятно, ко входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
