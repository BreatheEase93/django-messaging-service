{% extends 'base.html' %}

{% block title %}Пароль успешно изменен{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="card-body">
                <div class="text-success display-3 mb-3">✅</div>
                <h3 class="fw-bold text-dark mb-3">Готово! Пароль обновлён</h3>
                <p class="text-muted mb-4">Ваш новый пароль был успешно применён и сохранён в базе данных PostgreSQL. Теперь вы можете безопасно войти в свой личный кабинет.</p>
                <div class="d-grid">
                    <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg">🔑 Войти в аккаунт</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
